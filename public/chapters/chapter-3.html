M.parse=s=>{s=String(s).trim().replaceAll('−','-').replaceAll(' ','');if(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return Number(s);const m=s.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))\/([+-]?(?:\d+(?:\.\d*)?|\.\d+))$/);return m&&Number(m[2])!==0?Number(m[1])/Number(m[2]):NaN};
M.line=([a,b,c])=>{const terms=[[a,'x'],[b,'y']].filter(([n])=>n).map(([n,v])=>(n<0?' − ':' + ')+(Math.abs(n)===1?'':M.fmt(Math.abs(n)))+v).join('').replace(/^ \+ /,'').replace(/^ − /,'−');return `${terms||'0'} = ${M.fmt(-c)}`};

M.residual=([a,b,c],x,y)=>a*x+b*y+c;

M.solve=(l1,l2)=>{if(!M.validLine(l1)||!M.validLine(l2))return {type:'invalid'};const scale=l=>l.map(v=>v/Math.max(Math.abs(l[0]),Math.abs(l[1])));const[a,b,c]=scale(l1),[d,e,f]=scale(l2),det=a*e-d*b,near=(x,y)=>Math.abs(x-y)<=16*Number.EPSILON*Math.max(Math.abs(x),Math.abs(y),Number.MIN_VALUE);if(!near(a*e,d*b))return {type:'unique',x:(b*f-e*c)/det,y:(c*d-f*a)/det};return near(a*f,d*c)&&near(b*f,e*c)?{type:'infinite'}:{type:'none'}};

function home(){document.body.dataset.phase='learn';activeRun=null;const done=M.state.progress.completed.length;$('#view').innerHTML=`<div class="chapter-intro"><div><h1 class="route-focus" tabindex="-1">Make both clues<br>fit together.</h1><p class="lead">Explore pairs of linear equations through stories, lines and reversible steps. Find the values that satisfy both clues.</p><div class="journey-key"><span>1 Learn</span><span>2 Challenge</span><span>3 Reflect</span></div><div class="buttons"><button class="primary" id="start">Start with the algebra warm-up</button><button class="secondary" id="core">Try the core chapter challenge</button></div></div><div class="number-play" aria-label="Example: x plus y equals five and x minus y equals one have common solution x equals three, y equals two"><strong>x + y = 5<br>x − y = 1</strong><div class="pieces"><span>x = 3</span><span>y = 2</span></div><p>One pair makes both equations true.<br>Can you show why?</p></div></div><div class="map-heading"><h2>Your Chapter 3 trail</h2><p>${done} of 9 lessons marked complete · Separate from challenge evidence</p></div><div class="chapter-trail">${M.groups.map((g,i)=>`<article class="trail-row"><span class="trail-number">${i+1}</span><div><h3>${g.title}</h3><p>${g.intro}</p><div class="trail-meta">${badge(groupSkills(g.id)[0].scope)}<span>${groupSkills(g.id).length} skills</span><span>${M.state.progress.completed.includes(g.id)?'Marked complete':'Ready to explore'}</span></div></div><button class="secondary" data-open="${g.id}">Open lab</button></article>`).join('')}</div><div class="source-note"><details><summary>Curriculum, scope and saved progress</summary><p>Mapped to M10_03.pdf, Pair of Linear Equations in Two Variables, Reprint 2026–27, and the existing Class 10 Skills workbook: 37 core and 3 readiness skills. Generate coordinates, plot lines and verify common solutions. Graphical, substitution and elimination methods are developed. No separate cross-multiplication lesson is included in this supplied chapter.</p><p>Blue explanations are learning material. Yellow answers provide check evidence. Pink reflection uses your own responses. Written reasoning is saved separately for a teacher to review. Lesson completion is your own marker, rather than a mastery claim.</p><p>Chapter 3 uses its own local storage. Use one tab per learner. Backups export evidence and progress; import, accounts and cross-device sync are not implemented.</p><button class="secondary" id="readiness">Try the readiness check</button></details></div>`;

function learn(g){const skills=groupSkills(g.id);if(!skills.some(s=>s.id===activeSkill))activeSkill=skills[0].id;$('#view').innerHTML=header(g,'learn')+`<div class="lab-grid"><section class="panel" id="explorer"></section><aside class="yellow-note"><div class="skill-list">${skills.map((s,i)=>`<button data-skill="${s.id}" class="${s.id===activeSkill?'active':''}"><span>${i+1}</span>${e(s.title)}</button>`).join('')}</div><div id="teaching"></div><button class="primary" id="practice">Practise with support</button></aside></div><section class="panel reasoning"><h2>Build the reasoning</h2><h3>${e(g.transfer[0])}</h3><p>${e(g.transfer[1])}</p><label>Your explanation<textarea id="written" placeholder="Write your steps and explain why they work.">${e(M.state.drafts.written[g.id]?.text||'')}</textarea></label><div class="buttons"><button class="secondary" id="save-draft">Save my reasoning</button><span id="draft-status" class="saved-draft" role="status">${M.state.drafts.written[g.id]?'Saved draft loaded.':'Save your draft before leaving this lesson.'}</span></div><details><summary>Compare with worked reasoning</summary><p>${e(g.transfer[2])}</p></details><p class="small-copy">This is saved writing for discussion with a teacher. It is not automatically graded.</p></section><div class="learn-finish"><div><h2>Ready to try it yourself?</h2><p>Mark Learn complete when you have explored the ideas and written your reasoning.</p></div><button class="primary" id="finish-learn">Finish Learn & try Challenge</button></div>`;

function challenge(group,practice=false,chosenRun=null){const g=M.groups.find(g=>g.id===group);document.body.dataset.phase=practice?'learn':'challenge';activeRun=chosenRun||M.startRun(group,practice);const r=activeRun;if(r.complete){reflect(group,r.id);return;}const q=r.items[r.index],skill=M.skills.find(s=>s.id===q.skillId);$('#view').innerHTML=(g?header(g,practice?'learn':'challenge'):`<div class="lesson-heading"><div><h1 class="route-focus" tabindex="-1">${group===0?'Bring the core ideas together.':'Find your algebra starting point.'}</h1><p class="lead">${group===0?'37 questions across the core skills. Readiness has its own check and lab challenge.':'Three readiness questions. You can return to blue at any time.'}</p></div><button class="secondary" id="back-map">Chapter map</button></div>`)+`<div class="lab-grid"><section class="panel"><div class="quiz-counter"><span>Question ${r.index+1} of ${r.items.length}</span>${badge(skill.scope)}</div><h2 class="question">${e(q.prompt)}</h2>${q.graph?M.graph(q.graph.lines,q.graph):''}<p class="small-copy">${e(skill.title)}</p><form id="answer-form">${q.format==='choice'?`<div id="options" role="group" aria-label="Answer choices">${q.options.map((o,i)=>`<button type="button" class="option ${String(r.pending[0])===String(i)?'chosen':''}" data-choice="${i}" aria-pressed="${String(r.pending[0])===String(i)}"><span>${'ABCD'[i]}</span>${e(o)}</button>`).join('')}</div>`:`<div class="answer-fields">${q.fields.map((label,i)=>`<label>${e(label)}<input type="text" id="answer-${i}" data-answer="${i}" autocomplete="off" value="${e(r.pending[i]||'')}" spellcheck="false"></label>`).join('')}</div><p class="small-copy">Use numbers or fractions such as −1/3.  ${q.unordered?'Either order is accepted.':''}</p>`}${q.format==='plot'?'<button class="secondary" id="draw-answer" type="button">Draw my lines</button><div id="answer-plot"></div>':''}<div class="error" id="answer-error" role="alert"></div><div class="quiz-actions"><span class="small-copy">No timer. Room to think.</span><button class="primary" id="commit" type="submit">Save answer & continue</button></div></form></section><aside><div class="yellow-note"><h2>${practice?'Make room for support.':'A little thinking.<br>A big connection.'}</h2><p>${practice?'This is supported practice. You may use the hint and blue explanation.':'Try this form on your own. Every submitted answer is saved and explained in pink.'}</p><p>You can leave and resume this exact question, including your unfinished answer.</p><button class="secondary" id="get-help">${r.help?'Help recorded for this item':'Use a hint / record help'}</button><div id="help" ${r.help||practice?'':'hidden'} class="help-note">${e(q.hint)}<br>This response will be recorded as supported practice.</div></div><div style="padding:24px 8px"><h3>Need a refresher?</h3><p>Returning to the blue lesson records support for this current item.</p><button class="secondary" id="blue">Return to the blue lesson</button></div></aside></div>`;
if(g)bindPhases(group);else $('#back-map').onclick=()=>go('home');
const pending=()=>{M.save('progress');M.showSaveStatus()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{r.pending=[b.dataset.choice];pending();document.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('chosen',x===b);x.setAttribute('aria-pressed',String(x===b))});$('#answer-error').textContent=''});document.querySelectorAll('[data-answer]').forEach(input=>input.oninput=()=>{r.pending[Number(input.dataset.answer)]=input.value;r.plotDrawn=false;pending();$('#answer-error').textContent=''});

 const draw=()=>{const values=q.fields.map((_,i)=>M.parse($('#answer-'+i).value));if(values.some(x=>!Number.isFinite(x))){$('#answer-error').textContent='Enter all eight coordinates before drawing.';return;}const pts=Array.from({length:4},(_,i)=>values.slice(i*2,i*2+2)),lines=[M.through(pts[0],pts[1]),M.through(pts[2],pts[3])];if(lines.some(l=>l===null)){$('#answer-error').textContent='Choose two distinct points for each line.';return;}const domain=Math.max(6,Math.ceil(Math.max(...values.map(Math.abs))+1));$('#answer-plot').innerHTML=M.graph(lines,{domain,points:pts});r.plotDrawn=true;M.save('progress');$('#answer-error').textContent='';};$('#draw-answer').onclick=draw;if(r.plotDrawn)draw();
}

function reflect(group=null,runId=null){document.body.dataset.phase='reflect';const g=M.groups.find(g=>g.id===group),runs=M.state.progress.runs.filter(r=>group===null||r.group===group),r=runId?runs.find(r=>r.id===runId):runs.at(-1),attempts=r?M.state.evidence.attempts.filter(e=>e.runId===r.id):[];activeRun=r&&!r.complete?r:null;attempts.forEach(a=>M.expose(a.questionId));const correct=attempts.filter(a=>a.correct).length,missed=attempts.find(a=>!a.correct);

empts.length?'<p>Your reflections use your own answers. No example score has been filled in.</p>':''}</section><aside><div class="yellow-note"><h2>${missed?'Your next small step.':'Keep exploring.'}</h2><p>${missed?e(M.skills.find(s=>s.id===missed.skillId).repair):'Try explaining why an answer works. A teacher can review your saved written reasoning.'}</p><button class="primary" id="next-action">${missed?'Revisit this idea':r&&!r.complete?'Resume challenge':'Try a challenge'}</button></div><div class="reflection-aside"><h3>Progress, not a label.</h3><p>This score describes these responses. It does not establish mastery. Supported and repeated forms stay separate from independent checks.</p>${r?`<button class="secondary" id="retry">${r.complete?'Try another challenge':'Resume this run'}</button>`:''}</div></aside></div><details class="panel evidence-details"><summary>See mapped skills and check evidence</summary><p>Counts describe saved responses. Written drafts require teacher review; no mastery threshold is applied.</p><div class="table-wrap" tabindex="0" role="region" aria-label="Data table; scroll horizontally if needed"><table><thead><tr><th>Skill</th><th>Scope</th><th>Independent correct / submitted</th><th>Supported or repeated</th></tr></thead><tbody>${(g?groupSkills(g.id):M.skills).map(s=>{const aa=M.state.evidence.attempts.filter(a=>a.skillId===s.id),ind=aa.filter(a=>a.independent);return `<tr><td>${e(s.title)}<br><small>${s.id}</small></td><td>${badge(s.scope)}</td><td>${ind.filter(a=>a.correct).length} / ${ind.length}</td><td>${aa.length-ind.length}</td></tr>`}).join('')}</tbody></table></div></details>`;
if(g)bindPhases(group);else $('#back-map').onclick=()=>go('home');
const resume=()=>{if(r?.adaptive)return go(r.complete?'adaptive':'adaptive-check');if(!r)return go(g?`lab-${g.id}/challenge`:'challenge');go(r.group===0?'challenge':r.group===-1?'readiness':`lab-${r.group}/${r.practice?'practice':'challenge'}`)};
$('#next-action').onclick=()=>{if(missed){const s=M.skills.find(s=>s.id===missed.skillId);activeSkill=s.id;go(`lab-${s.group}/learn`)}else resume()};if($('#retry'))$('#retry').onclick=()=>{if(r.complete&&!r.adaptive)M.startRun(r.group,r.practice,true);resume()};if($('#choose-run'))$('#choose-run').onchange=ev=>reflect(group,ev.target.value);document.querySelectorAll('[data-revisit]').forEach(b=>b.onclick=()=>{const s=M.skills.find(s=>s.id===b.dataset.revisit);activeSkill=s.id;go(`lab-${s.group}/learn`)});}
function render(){try{route=decodeURIComponent(location.hash.slice(1)||M.state.progress.lastRoute||'home')}catch{route='home'};M.state.progress.lastRoute=route;M.save('progress');$('#chapter-menu').open=false;document.body.dataset.phase='learn';const match=route.match(/^lab-(\d+)\/(learn|challenge|reflect|practice)$/),g=match&&M.groups.find(g=>g.id===Number(match[1]));if(g){document.body.dataset.phase=match[2]==='practice'?'challenge':match[2];if(match[2]==='learn')learn(g);else if(match[2]==='reflect')reflect(g.id);else challenge(g.id,match[2]==='practice');}else if(route==='adaptive')A.mount();else if(route==='adaptive-check'){const r=A.active();if(r)challenge(r.group,r.practice,r);else A.mount();}else if(route==='challenge')challenge(0);else if(route==='readiness')challenge(-1);else if(route==='reflect')reflect();else home();A.decorate();if(M.storageError)$('#view').insertAdjacentHTML('afterbegin',`<div class="storage-warning" role="alert">${e(M.storageError)}</div>`);M.showSaveStatus();$('#nav').innerHTML=M.groups.map(g=>`<a href="#lab-${g.id}/learn" ${match&&Number(match[1])===g.id?'aria-current="page"':''}>${e(g.activity)}</a>`).join('');document.querySelectorAll('[data-top-phase]').forEach(b=>{const phase=b.dataset.topPhase;if(document.body.dataset.phase===phase)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');b.onclick=()=>{if(phase==='learn'&&activeRun&&!activeRun.complete){activeRun.help=true;M.save('progress');}go(g?`lab-${g.id}/${phase}`:phase==='learn'?'home':phase)};});const focus=$('.route-focus');if(focus){focus.focus({preventScroll:true});window.scrollTo(0,0)}}
