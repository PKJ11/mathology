": ["sin A", "cos A", "tan A"], "readinessGroup": 10, "scopeNote": "Mapped to M10_08.pdf, Reprint 2026–27, printed 113–132 and workbook rows 292–337: 43 core and three readiness skills. Six ratios, similarity, standard values, bounds and identities are developed. No separate complementary-angle identity unit is added.", "skills": [{"id": "M10.08.S01.M01", "group": 1, "title": "Locate the right angle and identify the hypotenuse", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Figs. 8.4-8.5 · Print 114-115; PDF 2-3", "workbookRow": 292, "prerequisite": "Right angles; triangle language", "unit": "Right-triangle representation", "goal": "Name sides relative to an angle", "lesson": "The hypotenuse lies opposite the right angle and is the longest side. In ABC right-angled at B, it is AC.", "repair": "Revisit this step: The hypotenuse lies opposite the right angle and is the longest side. In ABC right-angled at B, it is AC."}, {"id": "M10.08.S01.M02", "group": 1, "title": "Identify the side opposite the chosen acute angle", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Figs. 8.4-8.5 · Print 114-115; PDF 2-3", "workbookRow": 293, "prerequisite": "Right angles; triangle language", "unit": "Right-triangle representation", "goal": "Name sides relative to an angle", "lesson": "The opposite leg does not touch the chosen acute vertex. For angle A it is BC; for angle C it is AB.", "repair": "Revisit this step: The opposite leg does not touch the chosen acute vertex. For angle A it is BC; for angle C it is AB."}, {"id": "M10.08.S01.M03", "group": 1, "title": "Identify the adjacent leg excluding the hypotenuse", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Figs. 8.4-8.5 · Print 114-115; PDF 2-3", "workbookRow": 294, "prerequisite": "Right angles; triangle language", "unit": "Right-triangle representation", "goal": "Name sides relative to an angle", "lesson": "The adjacent leg touches the chosen acute angle but is not the hypotenuse. For A it is AB.", "repair": "Revisit this step: The adjacent leg touches the chosen acute angle but is not the hypotenuse. For A it is AB."}, {"id": "M10.08.S01.M04", "group": 1, "title": "Relabel opposite and adjacent when switching the reference angle", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Figs. 8.4-8.5 · Print 114-115; PDF 2-3", "workbookRow": 295, "prerequisite": "Right angles; triangle language", "unit": "Right-triangle representation", "goal": "Name sides relative to an angle", "lesson": "Changing the reference from A to C swaps opposite and adjacent. The hypotenuse AC stays the same.", "repair": "Revisit this step: Changing the reference from A to C swaps opposite and adjacent. The hypotenuse AC stays the same."}, {"id": "M10.08.S02.M01", "group": 2, "title": "Write sin as opposite/hypotenuse", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Ex. 8.1 · Print 115-121; PDF 3-9", "workbookRow": 296, "prerequisite": "Fractions; side identification", "unit": "Trigonometric ratios", "goal": "Form all six ratios", "lesson": "sin A=opposite/hypotenuse. A ratio is dimensionless when lengths use the same unit.", "repair": "Revisit this step: sin A=opposite/hypotenuse. A ratio is dimensionless when lengths use the same unit."}, {"id": "M10.08.S02.M02", "group": 2, "title": "Write cos as adjacent/hypotenuse", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Ex. 8.1 · Print 115-121; PDF 3-9", "workbookRow": 297, "prerequisite": "Fractions; side identification", "unit": "Trigonometric ratios", "goal": "Form all six ratios", "lesson": "cos A=adjacent/hypotenuse, with adjacent meaning the leg, not the hypotenuse.", "repair": "Revisit this step: cos A=adjacent/hypotenuse, with adjacent meaning the leg, not the hypotenuse."}, {"id": "M10.08.S02.M03", "group": 2, "title": "Write tan as opposite/adjacent", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Ex. 8.1 · Print 115-121; PDF 3-9", "workbookRow": 298, "prerequisite": "Fractions; side identification", "unit": "Trigonometric ratios", "goal": "Form all six ratios", "lesson": "tan A=opposite/adjacent. It can exceed one if the opposite leg is longer.", "repair": "Revisit this step: tan A=opposite/adjacent. It can exceed one if the opposite leg is longer."}, {"id": "M10.08.S02.M04", "group": 2, "title": "Form cosec, sec and cot as reciprocal ratios", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Ex. 8.1 · Print 115-121; PDF 3-9", "workbookRow": 299, "prerequisite": "Fractions; side identification", "unit": "Trigonometric ratios", "goal": "Form all six ratios", "lesson": "cosec A=hypotenuse/opposite; sec A=hypotenuse/adjacent; cot A=adjacent/opposite. They are reciprocals where denominators are nonzero.", "repair": "Revisit this step: cosec A=hypotenuse/opposite; sec A=hypotenuse/adjacent; cot A=adjacent/opposite. They are reciprocals where denominators are nonzero."}, {"id": "M10.08.S02.M05", "group": 2, "title": "Relate tan to sin/cos and cot to cos/sin", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Ex. 8.1 · Print 115-121; PDF 3-9", "workbookRow": 300, "prerequisite": "Fractions; side identification", "unit": "Trigonometric ratios", "goal": "Form all six ratios", "lesson": "tan A=sin A/cos A, and cot A=cos A/sin A, wherever the denominator is nonzero.", "repair": "Revisit this step: tan A=sin A/cos A, and cot A=cos A/sin A, wherever the denominator is nonzero."}, {"id": "M10.08.S02.M06", "group": 2, "title": "Interpret sin A as function notation rather than multiplication", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Ex. 8.1 · Print 115-121; PDF 3-9", "workbookRow": 301, "prerequisite": "Fractions; side identification", "unit": "Trigonometric ratios", "goal": "Form all six ratios", "lesson": "sin A names the sine of angle A. It is not sin multiplied by A; sin²A means (sin A)².", "repair": "Revisit this step: sin A names the sine of angle A. It is not sin multiplied by A; sin²A means (sin A)²."}, {"id": "M10.08.S03.M01", "group": 3, "title": "Identify similar right triangles with the same acute angle", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Fig. 8.6 · Print 116-117; PDF 4-5", "workbookRow": 302, "prerequisite": "AA similarity; proportions", "unit": "Similarity and ratios", "goal": "Explain why size does not change a ratio", "lesson": "Two right triangles with one equal acute angle have two equal angle pairs, so they are similar by AA.", "repair": "Revisit this step: Two right triangles with one equal acute angle have two equal angle pairs, so they are similar by AA."}, {"id": "M10.08.S03.M02", "group": 3, "title": "Match their corresponding sides", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Fig. 8.6 · Print 116-117; PDF 4-5", "workbookRow": 303, "prerequisite": "AA similarity; proportions", "unit": "Similarity and ratios", "goal": "Explain why size does not change a ratio", "lesson": "Match hypotenuse to hypotenuse and legs by their relation to the equal acute angle.", "repair": "Revisit this step: Match hypotenuse to hypotenuse and legs by their relation to the equal acute angle."}, {"id": "M10.08.S03.M03", "group": 3, "title": "Cancel a common scale factor in a side ratio", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Fig. 8.6 · Print 116-117; PDF 4-5", "workbookRow": 304, "prerequisite": "AA similarity; proportions", "unit": "Similarity and ratios", "goal": "Explain why size does not change a ratio", "lesson": "A common positive scale factor cancels: (k×opposite)/(k×hypotenuse)=opposite/hypotenuse.", "repair": "Revisit this step: A common positive scale factor cancels: (k×opposite)/(k×hypotenuse)=opposite/hypotenuse."}, {"id": "M10.08.S03.M04", "group": 3, "title": "Conclude that each trigonometric ratio depends on the angle, not triangle size", "scope": "Curriculum core", "source": "M10_08.pdf · §8.2; Fig. 8.6 · Print 116-117; PDF 4-5", "workbookRow": 305, "prerequisite": "AA similarity; proportions", "unit": "Similarity and ratios", "goal": "Explain why size does not change a ratio", "lesson": "Similar right triangles with the same acute angle have the same ratios, regardless of their physical size.", "repair": "Revisit this step: Similar right triangles with the same acute angle have the same ratios, regardless of their physical size."}, {"id": "M10.08.S04.M01", "group": 4, "title": "Represent a known ratio using a common scale factor", "scope": "Curriculum core", "source": "M10_08.pdf · Examples 1-5; Ex. 8.1 · Print 118-121; PDF 6-9", "workbookRow": 306, "prerequisite": "Pythagoras; algebra", "unit": "Finding ratios", "goal": "Find unknown sides and remaining ratios", "lesson": "If tan A=p/q, write opposite=pk, adjacent=qk with k>0. A ratio alone does not fix triangle size.", "repair": "Revisit this step: If tan A=p/q, write opposite=pk, adjacent=qk with k>0. A ratio alone does not fix triangle size."}, {"id": "M10.08.S04.M02", "group": 4, "title": "Use Pythagoras to calculate the third side", "scope": "Curriculum core", "source": "M10_08.pdf · Examples 1-5; Ex. 8.1 · Print 118-121; PDF 6-9", "workbookRow": 307, "prerequisite": "Pythagoras; algebra", "unit": "Finding ratios", "goal": "Find unknown sides and remaining ratios", "lesson": "Apply Pythagoras to the chosen positive side model. For legs pk,qk the hypotenuse is k√(p²+q²).", "repair": "Revisit this step: Apply Pythagoras to the chosen positive side model. For legs pk,qk the hypotenuse is k√(p²+q²)."}, {"id": "M10.08.S04.M03", "group": 4, "title": "Select the positive side length for an acute triangle", "scope": "Curriculum core", "source": "M10_08.pdf · Examples 1-5; Ex. 8.1 · Print 118-121; PDF 6-9", "workbookRow": 308, "prerequisite": "Pythagoras; algebra", "unit": "Finding ratios", "goal": "Find unknown sides and remaining ratios", "lesson": "Side lengths and ratios of an acute right triangle are positive. Choose the positive square root for a missing side.", "repair": "Revisit this step: Side lengths and ratios of an acute right triangle are positive. Choose the positive square root for a missing side."}, {"id": "M10.08.S04.M04", "group": 4, "title": "Substitute the sides into another ratio", "scope": "Curriculum core", "source": "M10_08.pdf · Examples 1-5; Ex. 8.1 · Print 118-121; PDF 6-9", "workbookRow": 309, "prerequisite": "Pythagoras; algebra", "unit": "Finding ratios", "goal": "Find unknown sides and remaining ratios", "lesson": "After finding the third side, use its correct opposite/adjacent/hypotenuse role to form the requested ratio.", "repair": "Revisit this step: After finding the third side, use its correct opposite/adjacent/hypotenuse role to form the requested ratio."}, {"id": "M10.08.S04.M05", "group": 4, "title": "Simplify a fraction or surd ratio", "scope": "Curriculum core", "source": "M10_08.pdf · Examples 1-5; Ex. 8.1 · Print 118-121; PDF 6-9", "workbookRow": 310, "prerequisite": "Pythagoras; algebra", "unit": "Finding ratios", "goal": "Find unknown sides and remaining ratios", "lesson": "Cancel common positive factors and retain exact radicals. For sin A=3/4, cos A=√7/4 and tan A=3/√7.", "repair": "Revisit this step: Cancel common positive factors and retain exact radicals. For sin A=3/4, cos A=√7/4 and tan A=3/√7."}, {"id": "M10.08.S05.M01", "group": 5, "title": "Use a half-equilateral triangle to obtain 30° and 60° ratios", "scope": "Curriculum core", "source": "M10_08.pdf · §8.3; Table 8.1; Ex. 8.2 · Print 121-127; PDF 9-15", "workbookRow": 311, "prerequisite": "Equilateral and isosceles triangles", "unit": "Standard angles", "goal": "Derive and use exact values", "lesson": "Halve an equilateral triangle of side 2a: hypotenuse 2a, short leg a, long leg √3 a. These give 30° and 60° exact ratios.", "repair": "Revisit this step: Halve an equilateral triangle of side 2a: hypotenuse 2a, short leg a, long leg √3 a. These give 30° and 60° exact ratios."}, {"id": "M10.08.S05.M02", "group": 5, "title": "Use an isosceles right triangle to obtain 45° ratios", "scope": "Curriculum core", "source": "M10_08.pdf · §8.3; Table 8.1; Ex. 8.2 · Print 121-127; PDF 9-15", "workbookRow": 312, "prerequisite": "Equilateral and isosceles triangles", "unit": "Standard angles", "goal": "Derive and use exact values", "lesson": "An isosceles right triangle with legs a,a has hypotenuse a√2, so sin45°=cos45°=1/√2 and tan45°=1.", "repair": "Revisit this step: An isosceles right triangle with legs a,a has hypotenuse a√2, so sin45°=cos45°=1/√2 and tan45°=1."}, {"id": "M10.08.S05.M03", "group": 5, "title": "Recall exact values for the six ratios at standard angles", "scope": "Curriculum core", "source": "M10_08.pdf · §8.3; Table 8.1; Ex. 8.2 · Print 121-127; PDF 9-15", "workbookRow": 313, "prerequisite": "Equilateral and isosceles triangles", "unit": "Standard angles", "goal": "Derive and use exact values", "lesson": "Use exact values at 0°,30°,45°,60°,90°. Reciprocal ratios are defined only when their denominator is nonzero.", "repair": "Revisit this step: Use exact values at 0°,30°,45°,60°,90°. Reciprocal ratios are defined only when their denominator is nonzero."}, {"id": "M10.08.S05.M04", "group": 5, "title": "Distinguish exact radical values from decimal approximations", "scope": "Curriculum core", "source": "M10_08.pdf · §8.3; Table 8.1; Ex. 8.2 · Print 121-127; PDF 9-15", "workbookRow": 314, "prerequisite": "Equilateral and isosceles triangles", "unit": "Standard angles", "goal": "Derive and use exact values", "lesson": "√3/2 is exact; 0.866… is approximate. Enter sqrt(3)/2 when exact reasoning is requested.", "repair": "Revisit this step: √3/2 is exact; 0.866… is approximate. Enter sqrt(3)/2 when exact reasoning is requested."}, {"id": "M10.08.S05.M05", "group": 5, "title": "Recognise undefined ratios caused by division by zero at 0° or 90°", "scope": "Curriculum core", "source": "M10_08.pdf · §8.3; Table 8.1; Ex. 8.2 · Print 121-127; PDF 9-15", "workbookRow": 315, "prerequisite": "Equilateral and isosceles triangles", "unit": "Standard angles", " r": "Revisit this step: If sin(A−B)=1/2 and cos(A+B)=1/2, with 0°<A−B<A+B≤90°, then A−B=30° and A+B=60°."}, {"id": "M10.08.S06.M04", "group": 6, "title": "Solve the resulting linear equations for A and B", "scope": "Curriculum core", "source": "M10_08.pdf · Examples 6-8; Ex. 8.2 · Print 125-127; PDF 13-15", "workbookRow": 319, "prerequisite": "Standard values; equations", "unit": "Angle reasoning", "goal": "Infer an acute angle from a ratio", "lesson": "Add/subtract the angle equations: A=(sum+difference)/2, B=(sum−difference)/2; verify the required angle constraints.", "repair": "Revisit this step: Add/subtract the angle equations: A=(sum+difference)/2, B=(sum−difference)/2; verify the required angle constraints."}, {"id": "M10.08.S07.M01", "group": 7, "title": "Check that sin and cos of an acute angle lie between zero and one", "scope": "Curriculum core", "source": "M10_08.pdf · Ex. 8.1 Q11; Ex. 8.2 Q4 · Print 121,127; PDF 9, 15", "workbookRow": 320, "prerequisite": "Inequalities; standard values", "unit": "Behaviour and bounds", "goal": "Reason about ratio values", "lesson": "For an acute angle, 0<sin A<1 and 0<cos A<1 because each leg is shorter than the hypotenuse.", "repair": "Revisit this step: For an acute angle, 0<sin A<1 and 0<cos A<1 because each leg is shorter than the hypotenuse."}, {"id": "M10.08.S07.M02", "group": 7, "title": "Recognise that tan can exceed one", "scope": "Curriculum core", "source": "M10_08.pdf · Ex. 8.1 Q11; Ex. 8.2 Q4 · Print 121,127; PDF 9, 15", "workbookRow": 321, "prerequisite": "Inequalities; standard values", "unit": "Behaviour and bounds", "goal": "Reason about ratio values", "lesson": "tan A can exceed one. At 60°, tan A=√3>1.", "repair": "Revisit this step: tan A can exceed one. At 60°, tan A=√3>1."}, {"id": "M10.08.S07.M03", "group": 7, "title": "Describe sin increasing and cos decreasing over 0° to 90°", "scope": "Curriculum core", "source": "M10_08.pdf · Ex. 8.1 Q11; Ex. 8.2 Q4 · Print 121,127; PDF 9, 15", "workbookRow": 322, "prerequisite": "Inequalities; standard values", "unit": "Behaviour and bounds", "goal": "Reason about ratio values", "lesson": "Across 0° to 90°, sine increases from 0 to 1 and cosine decreases from 1 to 0; compare the source exact-angle table.", "repair": "Revisit this step: Across 0° to 90°, sine increases from 0 to 1 and cosine decreases from 1 to 0; compare the source exact-angle table."}, {"id": "M10.08.S07.M04", "group": 7, "title": "Reject sin(A+B)=sin A+sin B using a counterexample", "scope": "Curriculum core", "source": "M10_08.pdf · Ex. 8.1 Q11; Ex. 8.2 Q4 · Print 121,127; PDF 9, 15", "workbookRow": 323, "prerequisite": "Inequalities; standard values", "unit": "Behaviour and bounds", "goal": "Reason about ratio values", "lesson": "A counterexample disproves a universal claim: sin(30°+30°)=√3/2, while sin30°+sin30°=1.", "repair": "Revisit this step: A counterexample disproves a universal claim: sin(30°+30°)=√3/2, while sin30°+sin30°=1."}, {"id": "M10.08.S07.M05", "group": 7, "title": "Distinguish a trigonometric square from the ratio of a doubled angle", "scope": "Curriculum core", "source": "M10_08.pdf · Ex. 8.1 Q11; Ex. 8.2 Q4 · Print 121,127; PDF 9, 15", "workbookRow": 324, "prerequisite": "Inequalities; standard values", "unit": "Behaviour and bounds", "goal": "Reason about ratio values", "lesson": "sin²A is (sin A)²; sin2A is sin(2×A). At A=30°, the former is 1/4 and the latter √3/2.", "repair": "Revisit this step: sin²A is (sin A)²; sin2A is sin(2×A). At A=30°, the former is 1/4 and the latter √3/2."}, {"id": "M10.08.S08.M01", "group": 8, "title": "Derive sin²A+cos²A=1 from a right triangle", "scope": "Curriculum core", "source": "M10_08.pdf · §8.4 · Print 128-129; PDF 16-17", "workbookRow": 325, "prerequisite": "Pythagoras; algebraic division", "unit": "Identities", "goal": "Use the three basic identities", "lesson": "Divide a²+b²=c² by c²: (a/c)²+(b/c)²=1, hence cos²A+sin²A=1.", "repair": "Revisit this step: Divide a²+b²=c² by c²: (a/c)²+(b/c)²=1, hence cos²A+sin²A=1."}, {"id": "M10.08.S08.M02", "group": 8, "title": "Derive 1+tan²A=sec²A by division where defined", "scope": "Curriculum core", "source": "M10_08.pdf · §8.4 · Print 128-129; PDF 16-17", "workbookRow": 326, "prerequisite": "Pythagoras; algebraic division", "unit": "Identities", "goal": "Use the three basic identities", "lesson": "Dividing Pythagoras by adjacent² gives 1+tan²A=sec²A. It is valid where cos A≠0; in this source 0°≤A<90°.", "repair": "Revisit this step: Dividing Pythagoras by adjacent² gives 1+tan²A=sec²A. It is valid where cos A≠0; in this source 0°≤A<90°."}, {"id": "M10.08.S08.M03", "group": 8, "title": "Derive 1+cot²A=cosec²A by division where defined", "scope": "Curriculum core", "source": "M10_08.pdf · §8.4 · Print 128-129; PDF 16-17", "workbookRow": 327, "prerequisite": "Pythagoras; algebraic division", "unit": "Identities", "goal": "Use the three basic identities", "lesson": "Dividing by opposite² gives 1+cot²A=cosec²A. It is valid where sin A≠0; here 0°<A≤90°.", "repair": "Revisit this step: Dividing by opposite² gives 1+cot²A=cosec²A. It is valid where sin A≠0; here 0°<A≤90°."}, {"id": "M10.08.S08.M04", "group": 8, "title": "Rearrange an identity to isolate a requested squared ratio", "scope": "Curriculum core", "source": "M10_08.pdf · §8.4 · Print 128-129; PDF 16-17", "workbookRow": 328, "prerequisite": "Pythagoras; algebraic division", "unit": "Identities", "goal": "Use the three basic identities", "lesson": "Rearrange the appropriate identity before substitution. cos²A=1−sin²A; tan²A=sec²A−1; cot²A=cosec²A−1.", "repair": "Revisit this step: Rearrange the appropriate identity before substitution. cos²A=1−sin²A; tan²A=sec²A−1; cot²A=cosec²A−1."}, {"id": "M10.08.S09.M01", "group": 9, "title": "Rewrite ratios using sin and cos when useful", "scope": "Curriculum core", "source": "M10_08.pdf · Examples 9-12; Ex. 8.3 · Print 129-132; PDF 17-20", "workbookRow": 329, "prerequisite": "Factorisation; fractions; identities", "unit": "Identity manipulation", "goal": "Simplify and prove identities", "lesson": "Rewrite sec=1/cos, cosec=1/sin, tan=sin/cos and cot=cos/sin; keep nonzero denominators explicit.", "repair": "Revisit this step: Rewrite sec=1/cos, cosec=1/sin, tan=sin/cos and cot=cos/sin; keep nonzero denominators explicit."}, {"id": "M10.08.S09.M02", "group": 9, "title": "Factor a difference of squares", "scope": "Curriculum core", "source": "M10_08.pdf · Examples 9-12; Ex. 8.3 · Print 129-132; PDF 17-20", "workbookRow": 330, "prerequisite": "Factorisation; fractions; identities", "unit": "Identity manipulation", "goal": "Simplify and prove identities", "lesson": "Factor 1−sin²A=(1−sin A)(1+sin A), then replace 1−sin²A with cos²A.", "repair": "Revisit this step: Factor 1−sin²A=(1−sin A)(1+sin A), then replace 1−sin²A with cos²A."}, {"id": "M10.08.S09.M03", "group": 9, "title": "Combine algebraic fractions with a common denominator", "scope": "Curriculum core", "source": "M10_08.pdf · Examples 9-12; Ex. 8.3 · Print 129-132; PDF 17-20", "workbookRow": 331, "prerequisite": "Factorisation; fractions; identities", "unit": "Identity manipulation", "goal": "Simplify and prove identities", "lesson": "Combine fractions only after obtaining a common denominator. cos/(1+sin)+(1+sin)/cos has denominator cos(1+sin).", "repair": "Revisit this step: Combine fractions only after obtaining a common denominator. cos/(1+sin)+(1+sin)/cos has denominator cos(1+sin)."}, {"id": "M10.08.S09.M04", "group": 9, "title": "Use a conjugate factor to simplify an expression", "scope": "Curriculum core", "source": "M10_08.pdf · Examples 9-12; Ex. 8.3 · Print 129-132; PDF 17-20", "workbookRow": 332, "prerequisite": "Factorisation; fractions; identities", "unit": "Identity manipulation", "goal": "Simplify and prove identities", "lesson": "Multiply numerator and denominator by a useful conjugate, such as 1+sin A; the difference of squares invokes the basic identity.", "repair": "Revisit this step: Multiply numerator and repair": "Revisit this step: In ABC right-angled at B, AC is opposite the right angle and is the hypotenuse."}, {"id": "M10.08.S10.M02", "group": 10, "title": "Use Pythagoras to find a missing side", "scope": "Prerequisite support", "source": "M10_08.pdf · Prior knowledge used in the cited chapter pages · Print 114-118; PDF 2-6", "workbookRow": 336, "prerequisite": "Earlier-year mathematics", "unit": "Readiness", "goal": "Trigonometry readiness", "lesson": "Use hypotenuse²=leg²+leg², or missing leg²=hypotenuse²−known leg². Take a positive root.", "repair": "Revisit this step: Use hypotenuse²=leg²+leg², or missing leg²=hypotenuse²−known leg². Take a positive root."}, {"id": "M10.08.S10.M03", "group": 10, "title": "Simplify ratios containing radicals", "scope": "Prerequisite support", "source": "M10_08.pdf · Prior knowledge used in the cited chapter pages · Print 114-118; PDF 2-6", "workbookRow": 337, "prerequisite": "Earlier-year mathematics", "unit": "Readiness", "goal": "Trigonometry readiness", "lesson": "Simplify fractions by common factors, and keep radicals exact: √12=2√3.", "repair": "Revisit this step: Simplify fractions by common factors, and keep radicals exact: √12=2√3."}], "groups": [{"id": 10, "activity": "Trigonometry readiness", "title": "Get the right-triangle tools ready.", "intro": "Find the hypotenuse, use Pythagoras and simplify exact ratios.", "transfer": ["One triangle, three side roles.", "For legs 3 and 4, explain why the hypotenuse is 5.", "The hypotenuse is opposite the right angle. Its square is 3²+4²=25, so its positive length is 5."]}, {"id": 1, "activity": "Side-name switchboard", "title": "Choose an angle. Rename the legs.", "intro": "Switch the acute reference angle while keeping the same triangle.", "transfer": ["Same triangle, a different viewpoint.", "In ABC right-angled at B with AB=3,BC=4, explain the side roles for A and C.", "For A, opposite BC=4 and adjacent AB=3. For C, opposite AB=3 and adjacent BC=4. AC=5 stays the hypotenuse."]}, {"id": 2, "activity": "Six-ratio builder", "title": "Build six ratios from three sides.", "intro": "Choose a ratio, connect its side pair and check its reciprocal.", "transfer": ["Explain a ratio without memorising a decimal.", "Use opposite 4, adjacent 3, hypotenuse 5 to form all six ratios.", "sin=4/5, cos=3/5, tan=4/3, cosec=5/4, sec=5/3, cot=3/4. The common unit cancels; reciprocals reverse each side pair."]}, {"id": 3, "activity": "Scale-invariance explorer", "title": "Change size. Keep the angle.", "intro": "Compare similar right triangles and cancel their common scale.", "transfer": ["Why does the angle determine the ratio?", "Compare legs 3,4 with 6,8 and explain sine of the matched angle.", "Hypotenuses are 5 and 10. AA gives similar right triangles; sin=4/5=8/10 because the common scale factor 2 cancels."]}, {"id": 4, "activity": "Recover the triangle", "title": "One known ratio unlocks the rest.", "intro": "Build a positive side model, find its missing side and recover the other ratios.", "transfer": ["A ratio fixes shape, not size.", "Given sin A=3/4 for an acute angle, determine cos A and tan A exactly.", "Choose opposite 3k and hypotenuse 4k, k>0. Adjacent=√7 k. Hence cos A=√7/4 and tan A=3/√7."]}, {"id": 5, "activity": "Exact-angle workshop", "title": "Make the special angles make sense.", "intro": "Derive 30°,45°,60° values, then inspect the endpoint definitions.", "transfer": ["Where does √3 come from?", "Halve an equilateral triangle of side 2 to derive the 30° ratios.", "The half-triangle has hypotenuse 2, short opposite leg 1 and adjacent leg √(4−1)=√3. sin30°=1/2,cos30°=√3/2,tan30°=1/√3."]}, {"id": 6, "activity": "Angle equation detective", "title": "Turn ratios into angle equations.", "intro": "Use the interval, then solve a linked sum and difference.", "transfer": ["Use the domain before solving.", "Given sin(A−B)=1/2, cos(A+B)=1/2, 0°<A−B<A+B≤90°, find A,B.", "A−B=30°, A+B=60°. Add:2A=90°, so A=45°. Subtract:2B=30°, so B=15°. Both conditions hold."]}, {"id": 7, "activity": "Bounds & counterexamples", "title": "Test a claim before believing it.", "intro": "Explore ratio bounds and use exact counterexamples for tempting false rules.", "transfer": ["One example can refute a universal claim.", "Disprove sin(A+B)=sin A+sin B using two 30° angles.", "The left side is sin60°=√3/2; the right side is 1/2+1/2=1. They differ, so the proposed identity is false."]}, {"id": 8, "activity": "Identity derivation studio", "title": "Let Pythagoras explain the identities.", "intro": "Choose a divisor and see which squared ratios appear.", "transfer": ["A numerical check is not the full proof.", "Derive 1+tan²A=sec²A and state its domain in this chapter.", "Divide adjacent²+opposite²=hypotenuse² by adjacent². This gives 1+(opposite/adjacent)²=(hypotenuse/adjacent)². Adjacent≠0; source domain is 0°≤A<90°."]}, {"id": 9, "activity": "Identity transformation studio", "title": "Transform with a reason at each step.", "intro": "Rewrite ratios, factor, combine fractions and preserve the original domain.", "transfer": ["Keep the domain when you simplify.", "Prove sec A(1−sin A)(sec A+tan A)=1 for acute A.", "Rewrite as (1−sin A)(1+sin A)/cos²A. Factor to (1−sin²A)/cos²A=cos²A/cos²A=1. The original needs cos A≠0; acute A meets this."]}]};
</script><script>(() => {
const M=window.Mathology8;
M.esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

M.fmt=n=>{if(!Number.isFinite(n))return 'undefined';for(let d=1;d<=1000;d++){const p=Math.round(n*d);if(Math.abs(p/d-n)<1e-10)return d===1?String(p):`${p}/${d}`}return String(Number(n.toFixed(8)))};
// Small expression grammar; no code execution. Supports exact fractions and radicals.
M.parse=input=>{try{const s=String(input).replaceAll('−','-').replaceAll('×','*').replaceAll(' ','');if(s.length>120)return NaN;const tokens=s.match(/sqrt|\d*\.\d+|\d+|[()+*/-]/g)||[];if(tokens.join('')!==s)return NaN;let i=0;const atom=()=>{let sign=1;while(['+','-'].includes(tokens[i])){if(tokens[i++]==='-')sign=-sign}let v;if(tokens[i]==='sqrt'){i++;if(tokens[i++]!=='(')throw 0;v=sum();if(tokens[i++]!==')'||v<0)throw 0;v=Math.sqrt(v)}else if(tokens[i]==='('){i++;v=sum();if(tokens[i++]!==')')throw 0}else{v=Number(tokens[i++]);if(!Number.isFinite(v))throw 0}return sign*v};const product=()=>{let v=atom();while(['*','/'].includes(tokens[i])){const op=tokens[i++],r=atom();if(op==='/'&&r===0)throw 0;v=op==='*'?v*r:v/r}return v};const sum=()=>{let v=product();while(['+','-'].includes(tokens[i])){const op=tokens[i++],r=product();v=op==='+'?v+r:v-r}return v};const v=sum();return i===tokens.length&&Number.isFinite(v)?v:NaN}catch{return NaN}};
const oldFormat=M.fmt;M.fmt=n=>{const raw=oldFormat(n);if(raw.includes('/')||!Number.isFinite(n)||Number.isInteger(Number(raw))||n===0)return raw;for(const d of [2,3,5,6,7,10,11,13,14,15,17,19,21,23,26,29,31,33,35,37,41,43,47,51,53,57,59,61,65,67,69,71,73])for(let den=1;den<=60;den++){const num=Math.round(n*den/Math.sqrt(d));if(num&&Math.abs(num*Math.sqrt(d)/den-n)<1e-10){const sign=num<0?'−':'',abs=Math.abs(num);return sign+(abs===1?'':abs)+'√'+d+(den===1?'':'/'+den);}}for(const d of [2,3,5,7])for(let a=-300;a<=300;a++){const b=Math.round((n-a)/Math.sqrt(d));if(a&&b&&Math.abs(b)<=300&&Math.abs(a+b*Math.sqrt(d)-n)<1e-10)return a+(b<0?' − ':' + ')+(Math.abs(b)===1?'':Math.abs(b))+'√'+d};return '≈ '+raw;};
M.point=p=>`(${p.map(M.fmt).join(', ')})`;
M.d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
M.section=(a,b,m,n)=>a.map((x,i)=>(n*x+m*b[i])/(m+n));
M.tan=a=>Math.tan(a*Math.PI/180);
M.sin=a=>Math.sin(a*Math.PI/180);
M.cos=a=>Math.cos(a*Math.PI/180);
M.table=(heads,rows)=>`<div class="table-wrap" tabindex="0" role="region" aria-label="Data table; scroll horizontally if needed"><table><thead><tr>${heads.map(h=>`<th>${M.esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${M.esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
M.svg=(title,body)=>`<div class="math-diagram"><svg viewBox="0 0 560 350" role="img" aria-label="${M.esc(title)}"><title>${M.esc(title)}</title>${body}</svg></div>`;
M.line=(a,b,color='#252333',dash=false)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${color}" stroke-width="3" ${dash?'stroke-dasharray="7 5"':''}/>`;
M.label=(p,t,dx=9,dy=-9)=>`<text x="${p[0]+dx}" y="${p[1]+dy}" fill="#252333" font-size="17" font-weight="650">${M.esc(t)}</text>`;

M.grid=(points,segments=[],extra='')=>{
 const coords=points.map(p=>p.xy),xmin=Math.min(0,...coords.map(p=>p[0]))-2,xmax=Math.max(0,...coords.map(p=>p[0]))+2,ymin=Math.min(0,...coords.map(p=>p[1]))-2,ymax=Math.max(0,...coords.map(p=>p[1]))+2;
 const scale=Math.min(460/(xmax-xmin),260/(ymax-ymin)),ox=(560-(xmax-xmin)*scale)/2,oy=40,map=p=>[ox+(p[0]-xmin)*scale,oy+(ymax-p[1])*scale];
 let body='',step=Math.max(1,Math.ceil(Math.max(xmax-xmin,ymax-ymin)/8));
 for(let x=Math.ceil(xmin/step)*step;x<=xmax;x+=step){body+=M.line(map([x,ymin]),map([x,ymax]),'#d5ccd2');if(x)body+=M.label(map([x,0]),M.fmt(x),-5,22)}
 for(let y=Math.ceil(ymin/step)*step;y<=ymax;y+=step){body+=M.line(map([xmin,y]),map([xmax,y]),'#d5ccd2');if(y)body+=M.label(map([0,y]),M.fmt(y),-25,5)}

 segments.forEach(s=>body+=M.line(map(coords[s[0]]),map(coords[s[1]]),s[2]||'#235876',s[3]));
 points.forEach(p=>body+=M.dot(map(p.xy),p.color)+M.label(map(p.xy),p.name));

};

function reflect(group=null,runId=null){document.body.dataset.phase='reflect';const g=M.groups.find(g=>g.id===group),runs=M.state.progress.runs.filter(r=>group===null||r.group===group),r=runId?runs.find(r=>r.id===runId):runs.at(-1),attempts=r?M.state.evidence.attempts.filter(e=>e.runId===r.id):[];activeRun=r&&!r.complete?r:null;attempts.forEach(a=>M.expose(a.questionId));const correct=attempts.filter(a=>a.correct).length,missed=attempts.find(a=>!a.correct);
